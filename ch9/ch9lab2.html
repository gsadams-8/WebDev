<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Request</title>
    <link rel="stylesheet" href="ch9lab.css">
</head>
<body>
    <h1>Trip Request</h1>
    <form id="request" action="https://formspree.io/f/YOUR_FORM_ID" method="post" class="panel">
        <p>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">E-mail Address:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="blog">Your travel blog (optional):</label>
            <input type="url" id="blog" name="blog" placeholder="https://">
        </p>

        <p>
            <label for="travelers">Number of travelers:</label>
            <input type="number" id="travelers" name="travelers" min="1" max="12" value="2">
        </p>

        <p>
            <label for="depart">Departure date:</label>
            <input type="date" id="depart" name="depart" min="2027-01-01">
        </p>

        <p>
            <label for="budget">Budget:</label>
            <input type="range" id="budget" name="budget" min="500" max="5000" step="100" value="2500">
        </p>

        <p>
            <label for="color">Pick a color for your trip folder:</label>
            <input type="color" id="color" name="color" value="#2f6b73">
        </p>

        <p>
            <label for="city">Favorite city:</label>
            <input type="text" id="city" name="city" list="cities">
            <datalist id="cities">
                <option value="Rome">
                <option value="Paris">
                <option value="Tokyo">
                <option value="Bali">
            </datalist>
        </p>

        <p>
            <label for="zip">ZIP or postal code:</label>
            <input type="text" id="zip" name="zip" pattern="[0-9]{5}" title="Five-digit US ZIP code (e.g. 12345)">
        </p>

        <p class="buttons">
            <button type="submit" class="submit-btn">Send Request</button>
        </p>
    </form>

    <footer>
        <p>Garrett Adams | <a href="mailto:gsadams@mail.lipscomb.edu">gsadams@mail.lipscomb.edu</a></p>
    </footer>
</body>
</html>
