<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garrett Adams - Chapter 6 Emulator Test</title>
    <style>
        /* Universal Box-Sizing Reset */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Large Initials Circle Badge */
        .initials-badge {
            width: 110px;
            height: 110px;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 4px solid #38bdf8;
            letter-spacing: 2px;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- Initials Badge -->
        <div class="initials-badge">GA</div>
        
        <h1>Garrett Adams</h1>
        <div class="subtitle">Chapter 6 Mobile Emulator Test</div>
        
    </main>

    <footer>
        <p>&copy; 2026 Garrett Adams. Web Development Coursework.</p>
    </footer>

</body>
</html>
