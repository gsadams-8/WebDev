<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkpoint 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <!-- Hovering over this link turns it teal because it is inside <header><nav> -->
      <a href="#">Home</a>
    </nav>
  </header>

  <main>
    <article>
      <!-- This h2 turns dark green with a bottom border because it is inside <article> -->
      <h2>Article Title</h2>
      <p>Article body text goes here.</p>
    </article>

    <!-- This h2 will NOT be green or underlined because it's outside <article> -->
    <h2>Regular Section Header</h2>
  </main>
</body>
</html>
